name: Sync fork with upstream (aiseeq/glint)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository != 'aiseeq/glint'
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main from upstream and push tags
        run: |
          git remote add upstream https://github.com/aiseeq/glint.git
          git fetch upstream --tags
          git checkout main
          git merge --ff-only upstream/main
          git push origin main
          git push origin --tags
